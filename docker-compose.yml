version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contentflow_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/contentflow?sslmode=disable
      - NEXTAUTH_URL=http://localhost:3000
      - AUTH_SECRET=cf_docker_secret_contentflow_2026_production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - REDIS_URL=redis://redis:6379
      - STORAGE_PROVIDER=local
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: contentflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contentflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: contentflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
